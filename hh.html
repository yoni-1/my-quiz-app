// Generate the quiz into the DOM

quizData.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    
    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.innerText = `${index + 1}. ${item.q}`;
    card.appendChild(qText);
    
    const optionsList = document.createElement('ul');
    optionsList.className = 'options-list';
    
    item.options.forEach((opt, oIndex) => {
        const li = document.createElement('li');
        li.className = 'option-item';
        li.innerText = opt;
        
        // Handle click event
        li.addEventListener('click', () => {
            // Disable further clicking on this specific question
            const siblings = optionsList.querySelectorAll('.option-item');
            siblings.forEach(el => el.classList.add('disabled'));
            
            // Check correctness
            if (oIndex === item.correct) {
                li.classList.add('correct');
            } else {
                li.classList.add('wrong');
                // Highlight the correct answer as well
                siblings[item.correct].classList.add('correct');
            }
            
            // Show explanation box
            explanationBox.style.display = 'block';
        });
        
        optionsList.appendChild(li);
    });
    
    card.appendChild(optionsList);
    
    const explanationBox = document.createElement('div');
    explanationBox.className = 'explanation-box';
    explanationBox.innerHTML = `<strong>Explanation:</strong> ${item.explanation}`;
    card.appendChild(explanationBox);
    
    container.appendChild(card);
});
